<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<!--META-->
<style>
  :root {
    --paper: #F2EFE9; --card: #FBF9F5; --ink: #1C1B19; --muted: #6E6A62; --line: #DDD7CC;
    --accent: #D4432A; --on-accent: #fff;
    --serif: "Instrument Serif", Georgia, "Times New Roman", serif;
    --mono: ui-monospace, "Geist Mono", SFMono-Regular, Menlo, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --paper: #161514; --card: #201F1D; --ink: #EDE9E2; --muted: #A39E95; --line: #34322E; --accent: #E5553A; }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.5 var(--sans); }
  .wrap { max-width: 760px; margin: 0 auto; padding: 0 16px; }
  header.top { padding: 20px 0 8px; display: flex; align-items: center; gap: 12px; }
  .biz { font: 22px/1.1 var(--serif); }
  .eyebrow { font: 11px/1 var(--mono); letter-spacing: .14em; color: var(--muted); margin: 28px 0 10px; text-transform: uppercase; }
  h1 { font: 400 clamp(34px, 8vw, 52px)/1.02 var(--serif); margin: 0 0 6px; letter-spacing: -.01em; }
  .meta { color: var(--muted); margin: 0 0 20px; }
  h2 { font: 400 28px/1.1 var(--serif); margin: 40px 0 14px; }
  .grid { display: grid; gap: 14px; }
  @media (min-width: 640px) { .grid.two { grid-template-columns: 1fr 1fr; } }

  /* The before/after slider */
  .ba { position: relative; overflow: hidden; border-radius: 10px; background: var(--line);
        touch-action: pan-y; user-select: none; -webkit-user-select: none; cursor: ew-resize; --pos: 50%; }
  .ba img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; }
  .ba .before-layer { position: absolute; inset: 0; overflow: hidden; clip-path: inset(0 calc(100% - var(--pos)) 0 0); pointer-events: none; }
  .ba .bar { position: absolute; top: 0; bottom: 0; left: var(--pos); width: 2px; margin-left: -1px; background: #fff;
             box-shadow: 0 0 0 1px rgba(0,0,0,.08); pointer-events: none; }
  .ba .knob { position: absolute; top: 50%; left: var(--pos); width: 40px; height: 40px; margin: -20px 0 0 -20px;
              border-radius: 50%; background: #fff; box-shadow: 0 2px 10px rgba(0,0,0,.25); pointer-events: none;
              display: grid; place-items: center; }
  .ba .knob::before { content: "‹ ›"; font: 600 14px/1 var(--sans); color: #333; letter-spacing: 2px; }
  .ba .tag { position: absolute; top: 10px; font: 10px/1 var(--mono); letter-spacing: .14em; color: #fff;
             background: rgba(0,0,0,.45); padding: 6px 8px; border-radius: 6px; pointer-events: none; }
  .ba .tag.l { left: 10px; } .ba .tag.r { right: 10px; }
  .ba input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
  .ba:focus-within { outline: 2px solid var(--accent); outline-offset: 3px; }
  .hint { font: 11px/1 var(--mono); letter-spacing: .12em; color: var(--muted); text-align: center; margin: 12px 0 0; text-transform: uppercase; }

  footer { margin: 56px 0 0; padding: 28px 0 40px; border-top: 1px solid var(--line); }
  .actions { display: grid; gap: 10px; }
  .btn { display: block; text-align: center; padding: 15px 18px; border-radius: 999px; text-decoration: none;
         font-weight: 600; border: 1.5px solid var(--ink); color: var(--ink); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .thanks { font: 26px/1.15 var(--serif); margin: 0 0 18px; }
  .badge { margin-top: 36px; text-align: center; font: 10px/1 var(--mono); letter-spacing: .14em; color: var(--muted); }
  .badge a { color: inherit; }
  .empty { padding: 80px 0; text-align: center; color: var(--muted); }

  /* A crop: the photo is drawn larger than its frame and shifted, so only the chosen part shows. */
  .frame { position: relative; overflow: hidden; border-radius: 10px; background: var(--line); }
  .frame img, .ba img.c { position: absolute; display: block; object-fit: cover; pointer-events: none; }
  .pair { position: relative; }
  .sbs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .sbs .tag { position: absolute; top: 8px; left: 8px; font: 10px/1 var(--mono); letter-spacing: .14em; color: #fff;
              background: rgba(0,0,0,.45); padding: 6px 8px; border-radius: 6px; pointer-events: none; }
  .expand { position: absolute; right: 8px; bottom: 8px; width: 44px; height: 44px; border-radius: 50%; border: 0;
            background: rgba(0,0,0,.5); color: #fff; font: 600 18px/1 var(--sans); cursor: pointer; display: grid; place-items: center; }
  .expand:focus-visible, .mode button:focus-visible, .viewer button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .mode { display: inline-flex; border: 1.5px solid var(--line); border-radius: 999px; padding: 3px; margin: 6px 0 18px; }
  .mode button { border: 0; background: none; color: var(--ink); font: 600 14px/1 var(--sans); padding: 10px 16px; border-radius: 999px; cursor: pointer; min-height: 40px; }
  .mode button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }

  .viewer { position: fixed; inset: 0; z-index: 10; background: #0d0c0b; color: #fff; display: flex; flex-direction: column;
            padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); touch-action: pan-y; }
  .viewer .bar2 { display: flex; align-items: center; justify-content: space-between; padding: 8px 8px 8px 16px; gap: 8px; }
  .viewer .count { font: 12px/1 var(--mono); letter-spacing: .12em; color: #bdb8af; }
  .viewer .label { font: 20px/1.2 var(--serif); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .viewer button { background: rgba(255,255,255,.12); border: 0; color: #fff; width: 48px; height: 48px; border-radius: 50%;
                   font: 600 20px/1 var(--sans); cursor: pointer; }
  .viewer .stage { flex: 1; display: grid; place-items: center; padding: 8px; min-height: 0; }
  .viewer .stage > * { width: 100%; max-width: min(100%, calc((100vh - 160px) * var(--ar, 0.75))); }
  .viewer .nav { display: flex; justify-content: center; gap: 24px; padding: 10px 0 16px; }
  .viewer button:disabled { opacity: .3; cursor: default; }
  body.locked { overflow: hidden; }
</style>
</head>
<body>
<main class="wrap" id="app"></main>
<script id="gallery-data" type="application/json">/*DATA*/</script>
<script>
(function () {
  "use strict";
  var data;
  try { data = JSON.parse(document.getElementById("gallery-data").textContent); } catch (e) { data = null; }
  var app = document.getElementById("app");

  // Every piece of text goes in with textContent, never as HTML.
  function el(tag, attrs, children) {
    var n = document.createElement(tag);
    if (attrs) for (var k in attrs) {
      if (k === "text") n.textContent = attrs[k];
      else if (k === "class") n.className = attrs[k];
      else n.setAttribute(k, attrs[k]);
    }
    (children || []).forEach(function (c) { if (c) n.appendChild(c); });
    return n;
  }
  function safeUrl(u) { return /^(https?:|tel:)/i.test(u || "") ? u : null; }

  function cropOf(pair) {
    var c = pair.crop;
    return (c && c.length === 4 && c[2] > c[0] && c[3] > c[1]) ? c : [0, 0, 1, 1];
  }
  function aspectOf(pair) {
    var c = cropOf(pair), b = pair.before;
    return (b.w * (c[2] - c[0])) / (b.h * (c[3] - c[1]));
  }
  // An image sized and shifted so only the crop shows inside its frame.
  function cropped(src, alt, cls, crop, load) {
    var cw = crop[2] - crop[0], ch = crop[3] - crop[1];
    var i = el("img", { "class": cls + " c", src: src, alt: alt, loading: load, decoding: "async" });
    i.style.width = (100 / cw) + "%"; i.style.height = (100 / ch) + "%";
    i.style.left = (-crop[0] / cw * 100) + "%"; i.style.top = (-crop[1] / ch * 100) + "%";
    return i;
  }

  function slider(pair, eager, title) {
    var b = pair.before, a = pair.after, crop = cropOf(pair);
    var box = el("div", { "class": "ba", role: "group", "aria-label": title || "Before and after" });
    box.style.aspectRatio = String(aspectOf(pair));
    var load = eager ? "eager" : "lazy";
    box.appendChild(cropped(a.src, "After", "after", crop, load));
    box.appendChild(el("div", { "class": "before-layer" }, [cropped(b.src, "Before", "before", crop, load)]));
    box.appendChild(el("div", { "class": "bar" }));
    box.appendChild(el("div", { "class": "knob" }));
    box.appendChild(el("span", { "class": "tag l", text: "BEFORE" }));
    box.appendChild(el("span", { "class": "tag r", text: "AFTER" }));
    var range = el("input", { type: "range", min: "0", max: "100", value: "50", "aria-label": "Slide to compare before and after" });
    box.appendChild(range);

    function set(p) {
      p = Math.max(0, Math.min(100, p));
      box.style.setProperty("--pos", p + "%");
      range.value = String(Math.round(p));
    }
    function fromEvent(ev) {
      var r = box.getBoundingClientRect();
      return (ev.clientX - r.left) / r.width * 100;
    }
    var dragging = false, startX = 0, startY = 0, decided = false;
    box.addEventListener("pointerdown", function (ev) {
      if (ev.target.closest && ev.target.closest(".expand")) return;
      dragging = true; decided = ev.pointerType === "mouse"; startX = ev.clientX; startY = ev.clientY;
      if (decided) { box.setPointerCapture(ev.pointerId); set(fromEvent(ev)); }
      ev.stopPropagation();
    });
    box.addEventListener("pointermove", function (ev) {
      if (!dragging) return;
      if (!decided) {
        // On touch, only take over once the finger is clearly moving sideways; vertical swipes scroll the page.
        var dx = Math.abs(ev.clientX - startX), dy = Math.abs(ev.clientY - startY);
        if (dx < 6 && dy < 6) return;
        if (dy > dx) { dragging = false; return; }
        decided = true; box.setPointerCapture(ev.pointerId);
      }
      set(fromEvent(ev));
      ev.stopPropagation();
    });
    function end(ev) {
      if (dragging && !decided && ev.type === "pointerup") set(fromEvent(ev)); // a tap jumps there
      if (dragging) ev.stopPropagation();
      dragging = false;
    }
    box.addEventListener("pointerup", end);
    box.addEventListener("pointercancel", function () { dragging = false; });
    box.addEventListener("click", function () { range.focus({ preventScroll: true }); });
    range.addEventListener("input", function () { set(+range.value); });
    return box;
  }

  function sideBySide(pair, eager, title) {
    var crop = cropOf(pair), ar = String(aspectOf(pair)), load = eager ? "eager" : "lazy";
    function half(img, word) {
      var f = el("div", { "class": "frame" });
      f.style.aspectRatio = ar;
      f.appendChild(cropped(img.src, word, "", crop, load));
      f.appendChild(el("span", { "class": "tag", text: word.toUpperCase() }));
      return f;
    }
    return el("div", { "class": "sbs", role: "group", "aria-label": title || "Before and after" }, [half(pair.before, "Before"), half(pair.after, "After")]);
  }

  // Every pair in page order, for the full-screen viewer.
  var all = [];
  var mode = "slider";
  try { if (localStorage.getItem("pairshot-mode") === "sbs") mode = "sbs"; } catch (e) {}

  function view(pair, eager, title) {
    return mode === "sbs" ? sideBySide(pair, eager, title) : slider(pair, eager, title);
  }
  function tile(pair, eager, title) {
    var index = all.length;
    all.push({ pair: pair, title: title });
    var wrap = el("div", { "class": "pair" }, [view(pair, eager, title)]);
    var btn = el("button", { "class": "expand", type: "button", "aria-label": "Show " + (title || "this pair") + " full screen", text: "⤢" });
    btn.addEventListener("click", function (ev) { ev.stopPropagation(); openViewer(index, btn); });
    wrap.appendChild(btn);
    return wrap;
  }

  function openViewer(index, opener) {
    var at = index;
    var label = el("div", { "class": "label" });
    var count = el("div", { "class": "count", "aria-live": "polite" });
    var close = el("button", { type: "button", "aria-label": "Close", text: "✕" });
    var prev = el("button", { type: "button", "aria-label": "Previous pair", text: "‹" });
    var next = el("button", { type: "button", "aria-label": "Next pair", text: "›" });
    var stage = el("div", { "class": "stage" });
    var v = el("div", { "class": "viewer", role: "dialog", "aria-modal": "true", "aria-label": "Photos full screen" }, [
      el("div", { "class": "bar2" }, [label, count, close]), stage, el("div", { "class": "nav" }, [prev, next]),
    ]);
    function show(i) {
      at = Math.max(0, Math.min(all.length - 1, i));
      var item = all[at];
      stage.textContent = "";
      v.style.setProperty("--ar", String(mode === "sbs" ? aspectOf(item.pair) * 2 : aspectOf(item.pair)));
      stage.appendChild(view(item.pair, true, item.title));
      label.textContent = item.title || job.title || "";
      count.textContent = (at + 1) + " / " + all.length;
      prev.disabled = at === 0; next.disabled = at === all.length - 1;
    }
    function shut() {
      document.removeEventListener("keydown", keys);
      v.remove(); document.body.classList.remove("locked");
      if (opener) opener.focus();
    }
    function keys(ev) {
      if (ev.key === "Escape") shut();
      else if (ev.key === "ArrowLeft" && !(ev.target && ev.target.type === "range")) show(at - 1);
      else if (ev.key === "ArrowRight" && !(ev.target && ev.target.type === "range")) show(at + 1);
      else if (ev.key === "Tab") { // keep focus inside
        var f = [close, prev, next].filter(function (b) { return !b.disabled; });
        if (ev.shiftKey && document.activeElement === f[0]) { ev.preventDefault(); f[f.length - 1].focus(); }
        else if (!ev.shiftKey && document.activeElement === f[f.length - 1]) { ev.preventDefault(); f[0].focus(); }
      }
    }
    close.addEventListener("click", shut);
    prev.addEventListener("click", function () { show(at - 1); });
    next.addEventListener("click", function () { show(at + 1); });
    // Swipe sideways anywhere the slider didn't take the touch to go to the next or previous pair.
    var sx = null, sy = 0;
    v.addEventListener("pointerdown", function (ev) { sx = ev.clientX; sy = ev.clientY; });
    v.addEventListener("pointerup", function (ev) {
      if (sx === null) return;
      var dx = ev.clientX - sx, dy = ev.clientY - sy; sx = null;
      if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) show(at + (dx < 0 ? 1 : -1));
    });
    document.addEventListener("keydown", keys);
    document.body.classList.add("locked");
    document.body.appendChild(v);
    show(index);
    close.focus();
  }

  if (!data || !data.cover) {
    app.appendChild(el("p", { "class": "empty", text: "These photos aren't ready yet. Check back soon." }));
    return;
  }
  if (data.business && data.business.accent && /^#[0-9a-f]{6}$/i.test(data.business.accent)) {
    document.documentElement.style.setProperty("--accent", data.business.accent);
  }
  var biz = data.business || {};
  var job = data.job || {};
  document.title = (job.title || "Before & after") + (biz.name ? " · " + biz.name : "");

  if (biz.name) app.appendChild(el("header", { "class": "top" }, [el("div", { "class": "biz", text: biz.name })]));
  app.appendChild(el("p", { "class": "eyebrow", text: "Before & after" }));
  app.appendChild(el("h1", { text: job.title || "Your job" }));
  var meta = [job.place, job.date].filter(Boolean).join(" · ");
  if (meta) app.appendChild(el("p", { "class": "meta", text: meta }));
  var toggle = el("div", { "class": "mode", role: "group", "aria-label": "How to compare" });
  var bSlider = el("button", { type: "button", text: "Slider" });
  var bSbs = el("button", { type: "button", text: "Side by side" });
  toggle.appendChild(bSlider); toggle.appendChild(bSbs);
  app.appendChild(toggle);
  var body = el("div");
  app.appendChild(body);

  function renderPairs() {
    all = [];
    body.textContent = "";
    bSlider.setAttribute("aria-pressed", String(mode === "slider"));
    bSbs.setAttribute("aria-pressed", String(mode === "sbs"));
    body.appendChild(tile(data.cover, true, data.cover.label || job.title));
    if (mode === "slider") body.appendChild(el("p", { "class": "hint", text: "Drag to compare" }));
    (data.sections || []).forEach(function (s) {
      if (!s.pairs || !s.pairs.length) return;
      var sec = el("section");
      if (s.label) sec.appendChild(el("h2", { text: s.label }));
      else if (data.sections.length > 1 || data.cover) sec.appendChild(el("h2", { text: "More" }));
      var grid = el("div", { "class": "grid" + (s.pairs.length > 1 && mode === "slider" ? " two" : "") });
      s.pairs.forEach(function (p) { grid.appendChild(tile(p, false, p.label || s.label)); });
      sec.appendChild(grid);
      body.appendChild(sec);
    });
  }
  function setMode(m) {
    mode = m;
    try { localStorage.setItem("pairshot-mode", m); } catch (e) {}
    renderPairs();
  }
  bSlider.addEventListener("click", function () { setMode("slider"); });
  bSbs.addEventListener("click", function () { setMode("sbs"); });
  renderPairs();

  var actions = el("div", { "class": "actions" });
  var review = safeUrl(biz.reviewUrl), booking = safeUrl(biz.bookingUrl);
  if (review) actions.appendChild(el("a", { "class": "btn primary", href: review, target: "_blank", rel: "noopener", text: "Leave a review" }));
  if (booking) actions.appendChild(el("a", { "class": "btn", href: booking, target: "_blank", rel: "noopener", text: "Book again" }));
  if (/^https:\/\//.test(data.download || "")) actions.appendChild(el("a", { "class": "btn", href: data.download, download: "", text: "Download all photos" }));
  if (biz.phone) actions.appendChild(el("a", { "class": "btn", href: "tel:" + String(biz.phone).replace(/[^0-9+]/g, ""), text: "Call " + (biz.name || "us") }));
  var footer = el("footer", null, [
    el("p", { "class": "thanks", text: "Thanks for choosing " + (biz.name || "us") + "." }),
    actions.childNodes.length ? actions : null,
  ]);
  if (data.badge) footer.appendChild(el("p", { "class": "badge", text: "MADE WITH PAIRSHOT" }));
  app.appendChild(footer);
})();
</script>
</body>
</html>
