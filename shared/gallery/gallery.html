<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<!--META-->
<style>
  :root {
    --paper: #F2EFE9; --card: #FBF9F5; --ink: #1C1B19; --muted: #6E6A62; --line: #DDD7CC;
    --accent: #D4432A; --on-accent: #fff;
    --serif: "Instrument Serif", Georgia, "Times New Roman", serif;
    --mono: ui-monospace, "Geist Mono", SFMono-Regular, Menlo, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --paper: #161514; --card: #201F1D; --ink: #EDE9E2; --muted: #A39E95; --line: #34322E; --accent: #E5553A; }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.5 var(--sans); }
  .wrap { max-width: 760px; margin: 0 auto; padding: 0 16px; }
  header.top { padding: 20px 0 8px; display: flex; align-items: center; gap: 12px; }
  .biz { font: 22px/1.1 var(--serif); }
  .eyebrow { font: 11px/1 var(--mono); letter-spacing: .14em; color: var(--muted); margin: 28px 0 10px; text-transform: uppercase; }
  h1 { font: 400 clamp(34px, 8vw, 52px)/1.02 var(--serif); margin: 0 0 6px; letter-spacing: -.01em; }
  .meta { color: var(--muted); margin: 0 0 20px; }
  h2 { font: 400 28px/1.1 var(--serif); margin: 40px 0 14px; }
  .grid { display: grid; gap: 14px; }
  @media (min-width: 640px) { .grid.two { grid-template-columns: 1fr 1fr; } }

  /* The before/after slider */
  .ba { position: relative; overflow: hidden; border-radius: 10px; background: var(--line);
        touch-action: pan-y; user-select: none; -webkit-user-select: none; cursor: ew-resize; --pos: 50%; }
  .ba img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; }
  .ba .before { clip-path: inset(0 calc(100% - var(--pos)) 0 0); }
  .ba .bar { position: absolute; top: 0; bottom: 0; left: var(--pos); width: 2px; margin-left: -1px; background: #fff;
             box-shadow: 0 0 0 1px rgba(0,0,0,.08); pointer-events: none; }
  .ba .knob { position: absolute; top: 50%; left: var(--pos); width: 40px; height: 40px; margin: -20px 0 0 -20px;
              border-radius: 50%; background: #fff; box-shadow: 0 2px 10px rgba(0,0,0,.25); pointer-events: none;
              display: grid; place-items: center; }
  .ba .knob::before { content: "‹ ›"; font: 600 14px/1 var(--sans); color: #333; letter-spacing: 2px; }
  .ba .tag { position: absolute; top: 10px; font: 10px/1 var(--mono); letter-spacing: .14em; color: #fff;
             background: rgba(0,0,0,.45); padding: 6px 8px; border-radius: 6px; pointer-events: none; }
  .ba .tag.l { left: 10px; } .ba .tag.r { right: 10px; }
  .ba input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
  .ba:focus-within { outline: 2px solid var(--accent); outline-offset: 3px; }
  .hint { font: 11px/1 var(--mono); letter-spacing: .12em; color: var(--muted); text-align: center; margin: 12px 0 0; text-transform: uppercase; }

  footer { margin: 56px 0 0; padding: 28px 0 40px; border-top: 1px solid var(--line); }
  .actions { display: grid; gap: 10px; }
  .btn { display: block; text-align: center; padding: 15px 18px; border-radius: 999px; text-decoration: none;
         font-weight: 600; border: 1.5px solid var(--ink); color: var(--ink); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .thanks { font: 26px/1.15 var(--serif); margin: 0 0 18px; }
  .badge { margin-top: 36px; text-align: center; font: 10px/1 var(--mono); letter-spacing: .14em; color: var(--muted); }
  .badge a { color: inherit; }
  .empty { padding: 80px 0; text-align: center; color: var(--muted); }
</style>
</head>
<body>
<main class="wrap" id="app"></main>
<script id="gallery-data" type="application/json">/*DATA*/</script>
<script>
(function () {
  "use strict";
  var data;
  try { data = JSON.parse(document.getElementById("gallery-data").textContent); } catch (e) { data = null; }
  var app = document.getElementById("app");

  // Every piece of text goes in with textContent, never as HTML.
  function el(tag, attrs, children) {
    var n = document.createElement(tag);
    if (attrs) for (var k in attrs) {
      if (k === "text") n.textContent = attrs[k];
      else if (k === "class") n.className = attrs[k];
      else n.setAttribute(k, attrs[k]);
    }
    (children || []).forEach(function (c) { if (c) n.appendChild(c); });
    return n;
  }
  function safeUrl(u) { return /^(https?:|tel:)/i.test(u || "") ? u : null; }

  function slider(pair, eager, title) {
    var b = pair.before, a = pair.after;
    var box = el("div", { "class": "ba", role: "group", "aria-label": title || "Before and after" });
    box.style.aspectRatio = b.w + " / " + b.h;
    var load = eager ? "eager" : "lazy";
    box.appendChild(el("img", { "class": "after", src: a.src, alt: "After", loading: load, decoding: "async" }));
    box.appendChild(el("img", { "class": "before", src: b.src, alt: "Before", loading: load, decoding: "async" }));
    box.appendChild(el("div", { "class": "bar" }));
    box.appendChild(el("div", { "class": "knob" }));
    box.appendChild(el("span", { "class": "tag l", text: "BEFORE" }));
    box.appendChild(el("span", { "class": "tag r", text: "AFTER" }));
    var range = el("input", { type: "range", min: "0", max: "100", value: "50", "aria-label": "Slide to compare before and after" });
    box.appendChild(range);

    function set(p) {
      p = Math.max(0, Math.min(100, p));
      box.style.setProperty("--pos", p + "%");
      range.value = String(Math.round(p));
    }
    function fromEvent(ev) {
      var r = box.getBoundingClientRect();
      return (ev.clientX - r.left) / r.width * 100;
    }
    var dragging = false, startX = 0, startY = 0, decided = false;
    box.addEventListener("pointerdown", function (ev) {
      dragging = true; decided = ev.pointerType === "mouse"; startX = ev.clientX; startY = ev.clientY;
      if (decided) { box.setPointerCapture(ev.pointerId); set(fromEvent(ev)); }
    });
    box.addEventListener("pointermove", function (ev) {
      if (!dragging) return;
      if (!decided) {
        // On touch, only take over once the finger is clearly moving sideways; vertical swipes scroll the page.
        var dx = Math.abs(ev.clientX - startX), dy = Math.abs(ev.clientY - startY);
        if (dx < 6 && dy < 6) return;
        if (dy > dx) { dragging = false; return; }
        decided = true; box.setPointerCapture(ev.pointerId);
      }
      set(fromEvent(ev));
    });
    function end(ev) {
      if (dragging && !decided && ev.type === "pointerup") set(fromEvent(ev)); // a tap jumps there
      dragging = false;
    }
    box.addEventListener("pointerup", end);
    box.addEventListener("pointercancel", function () { dragging = false; });
    box.addEventListener("click", function () { range.focus({ preventScroll: true }); });
    range.addEventListener("input", function () { set(+range.value); });
    return box;
  }

  if (!data || !data.cover) {
    app.appendChild(el("p", { "class": "empty", text: "These photos aren't ready yet. Check back soon." }));
    return;
  }
  if (data.business && data.business.accent && /^#[0-9a-f]{6}$/i.test(data.business.accent)) {
    document.documentElement.style.setProperty("--accent", data.business.accent);
  }
  var biz = data.business || {};
  var job = data.job || {};
  document.title = (job.title || "Before & after") + (biz.name ? " · " + biz.name : "");

  if (biz.name) app.appendChild(el("header", { "class": "top" }, [el("div", { "class": "biz", text: biz.name })]));
  app.appendChild(el("p", { "class": "eyebrow", text: "Before & after" }));
  app.appendChild(el("h1", { text: job.title || "Your job" }));
  var meta = [job.place, job.date].filter(Boolean).join(" · ");
  if (meta) app.appendChild(el("p", { "class": "meta", text: meta }));
  app.appendChild(slider(data.cover, true, data.cover.label || job.title));
  app.appendChild(el("p", { "class": "hint", text: "Drag to compare" }));

  (data.sections || []).forEach(function (s) {
    if (!s.pairs || !s.pairs.length) return;
    var sec = el("section");
    if (s.label) sec.appendChild(el("h2", { text: s.label }));
    else if (data.sections.length > 1 || data.cover) sec.appendChild(el("h2", { text: "More" }));
    var grid = el("div", { "class": "grid" + (s.pairs.length > 1 ? " two" : "") });
    s.pairs.forEach(function (p) { grid.appendChild(slider(p, false, s.label)); });
    sec.appendChild(grid);
    app.appendChild(sec);
  });

  var actions = el("div", { "class": "actions" });
  var review = safeUrl(biz.reviewUrl), booking = safeUrl(biz.bookingUrl);
  if (review) actions.appendChild(el("a", { "class": "btn primary", href: review, target: "_blank", rel: "noopener", text: "Leave a review" }));
  if (booking) actions.appendChild(el("a", { "class": "btn", href: booking, target: "_blank", rel: "noopener", text: "Book again" }));
  if (/^https:\/\//.test(data.download || "")) actions.appendChild(el("a", { "class": "btn", href: data.download, download: "", text: "Download all photos" }));
  if (biz.phone) actions.appendChild(el("a", { "class": "btn", href: "tel:" + String(biz.phone).replace(/[^0-9+]/g, ""), text: "Call " + (biz.name || "us") }));
  var footer = el("footer", null, [
    el("p", { "class": "thanks", text: "Thanks for choosing " + (biz.name || "us") + "." }),
    actions.childNodes.length ? actions : null,
  ]);
  if (data.badge) footer.appendChild(el("p", { "class": "badge", text: "MADE WITH PAIRSHOT" }));
  app.appendChild(footer);
})();
</script>
</body>
</html>
