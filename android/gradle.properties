# Sized for WSL's ~7 GB: Gradle (with lint) and the Kotlin compiler run side by side.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1536m
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Pairshot server the app uses by default (users can change it in Settings → Cloud & CRM).
pairshot.serverUrl=https://pairshot.pairshot-server.workers.dev
# Google sign-in: the Web OAuth client id from Google Cloud Console (public, not a secret).
# Leave empty to use test sign-in (only works while the server is in test mode).
pairshot.googleWebClientId=118026851240-ucj9denba83declo3r8p6521ok1ibc2q.apps.googleusercontent.com
# Google Cloud project number (Play Integrity). It's the number at the start of the client ID.
pairshot.cloudProjectNumber=118026851240
